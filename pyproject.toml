[project]
name = "kobayashi-pw"
version = "0.1.0"
description = "Exact pathwidth / vertex separation via Kobayashi's relevant-set DP, bottleneck (bucketed) search with ordering extraction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
kobayashi-pw = "kobayashi_pw.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
